name = "moonhoya"
main = ".open-next/worker.js"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "moonhoya_db"
database_id = "729cc67d-6d39-49e0-9c45-ca37e460f3da"

[[r2_buckets]]
binding = "MOONHOYA_PHOTOS"
bucket_name = "moonhoya-plant-photos"
